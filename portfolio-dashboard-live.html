<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0,user-scalable=yes,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Portfolio Command Center v4</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0f19;--card:#111827;--card2:#0f172a;--bdr:#1e293b;--txt:#e2e8f0;--dim:#64748b;--dim2:#475569;--g:#00d4aa;--r:#ff4757;--a:#fbbf24;--b:#3b82f6;--p:#a855f7}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:'Inter',system-ui,sans-serif;font-size:13px;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
.w{max-width:960px;margin:0 auto;padding:10px}
.hd{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bdr);margin-bottom:8px;flex-wrap:wrap;gap:6px}
.hd h1{font-size:13px;font-weight:900;letter-spacing:1.2px;background:linear-gradient(135deg,var(--g),var(--b));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hd .sub{font-size:8px;color:var(--dim);margin-top:2px}
.hd .rv{text-align:right}.hd .rv .lb{font-size:8px;color:var(--dim)}.hd .rv .vl{font-size:15px;font-weight:900}
.cg{color:var(--g)}.cr{color:var(--r)}.ca{color:var(--a)}.cb{color:var(--b)}.cp{color:var(--p)}
.topbar{padding:8px 10px;background:var(--card);border:1px solid var(--bdr);border-radius:8px;margin-bottom:8px}
.topbar .row1{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px}
.topbar .status{font-size:9px;color:var(--dim)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:3px;vertical-align:middle}
.dot-live{background:var(--g);box-shadow:0 0 6px var(--g)}.dot-off{background:var(--r)}.dot-load{background:var(--a);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.topbar .acts{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-top:6px}
.topbar input{width:155px;padding:4px 7px;border-radius:5px;font-size:10px;font-family:inherit;background:var(--card2);color:var(--a);border:1px solid var(--bdr);outline:none}
.topbar input:focus{border-color:var(--a)}
.topbar input::placeholder{color:var(--dim2)}
.btn{padding:5px 10px;border-radius:5px;border:none;font-size:9px;font-weight:700;font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;white-space:nowrap}
.btn-g{background:var(--g);color:#000}.btn-b{background:var(--b);color:#fff}.btn-a{background:var(--a);color:#000}.btn-p{background:var(--p);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.prog{margin-bottom:8px}.prog .bar{height:4px;background:var(--bdr);border-radius:2px;overflow:hidden}
.prog .fill{height:100%;background:linear-gradient(90deg,var(--g),var(--b));border-radius:2px;transition:width .3s}
.prog .info{font-size:8px;color:var(--dim);margin-top:3px;display:flex;justify-content:space-between}
.errlog{margin-bottom:6px;padding:5px 8px;background:rgba(255,71,87,.08);border:1px solid rgba(255,71,87,.2);border-radius:6px;font-size:9px;color:var(--r);line-height:1.4}
.st{display:flex;gap:4px;margin-bottom:8px;overflow-x:auto;padding-bottom:3px;-webkit-overflow-scrolling:touch}
.st::-webkit-scrollbar{height:2px}.st::-webkit-scrollbar-thumb{background:var(--bdr)}
.st button{flex-shrink:0;padding:5px 9px;border-radius:6px;border:1px solid var(--bdr);background:transparent;color:var(--dim);font-family:inherit;font-size:9px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent}
.st button.on{border-color:var(--g);background:rgba(0,212,170,.08);color:#fff}
.st .dum{border-style:dashed;opacity:.45;font-size:8px}
.tb{display:flex;gap:2px;margin-bottom:8px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tb::-webkit-scrollbar{height:0}
.tb button{flex-shrink:0;padding:6px 10px;border-radius:6px;border:none;font-size:9px;font-weight:700;font-family:inherit;cursor:pointer;background:transparent;color:var(--dim);-webkit-tap-highlight-color:transparent;white-space:nowrap}
.tb button.on{background:var(--b);color:#fff}
.cd{background:var(--card);border:1px solid var(--bdr);border-radius:8px;padding:10px;margin-bottom:8px}
.cd.warn{border-color:rgba(255,71,87,.2)}
.ct{font-size:10px;font-weight:700;margin-bottom:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
.bx{padding:5px;background:var(--card2);border-radius:4px}.bx .lb{color:var(--dim);font-size:7px}.bx .vl{font-weight:700;font-size:10px;margin-top:1px}
.tbl{width:100%;border-collapse:collapse;font-size:9px}
.tbl th{padding:4px 2px;text-align:center;color:var(--dim);font-weight:600;font-size:7px;border-bottom:1px solid var(--bdr);white-space:nowrap}
.tbl td{padding:4px 2px;text-align:center;border-bottom:1px solid rgba(30,41,59,.15)}
.tbl tr.ck{cursor:pointer}.tbl tr.ck:hover{background:rgba(30,41,59,.3)}
.pl{padding:2px 5px;border-radius:4px;font-size:7px;font-weight:800;display:inline-block}
.sb{margin-bottom:4px}.sb .tp{display:flex;justify-content:space-between;font-size:8px;color:var(--dim);margin-bottom:2px}
.sb .br{height:4px;background:var(--bdr);border-radius:3px;position:relative;overflow:hidden}
.sb .fl{height:100%;border-radius:3px;position:absolute}.sb .cn{position:absolute;left:50%;top:0;width:1px;height:100%;background:var(--dim2)}
.sg{margin-top:10px;padding:10px;background:var(--card2);border-radius:8px;text-align:center}
.sg .nm{font-size:20px;font-weight:900;letter-spacing:2px}.sg .ds{font-size:8px;color:var(--dim);margin-top:3px}
.ag{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:5px}
.ai{padding:8px;border-radius:8px;background:var(--card2)}.ai .ab{height:3px;background:var(--bdr);border-radius:2px;margin-top:4px}.ai .af{height:100%;border-radius:2px}
.el{max-height:200px;overflow-y:auto}.er{display:flex;align-items:flex-start;gap:5px;padding:3px 0;border-bottom:1px solid rgba(30,41,59,.1);font-size:9px}
.tr{margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--bdr)}
.ti{width:55px;padding:3px 5px;border-radius:4px;font-size:10px;font-family:inherit;background:var(--card2);color:var(--a);border:1px solid rgba(251,191,36,.3);text-align:right;outline:none}
.ti:focus{border-color:var(--a)}
.cc{position:relative;width:100%;height:140px}.cc canvas{width:100%!important;height:100%!important}
.lg{display:flex;gap:8px;font-size:7px;color:var(--dim);justify-content:center;margin-top:3px}
.lg i{display:inline-block;width:10px;height:2px;border-radius:1px;margin-right:2px;vertical-align:middle}
input[type=range]{width:100%;accent-color:var(--a);cursor:pointer;height:22px}
.sec-card{background:var(--card2);border-radius:8px;padding:10px;border-left:3px solid var(--dim)}
.sec-bar{height:6px;background:var(--bdr);border-radius:3px;overflow:hidden;margin-top:4px}
.sec-fill{height:100%;border-radius:3px;transition:width .3s}
.quota{font-size:8px;color:var(--dim);padding:2px 6px;background:var(--card2);border-radius:4px}
.badge{font-size:7px;padding:1px 4px;border-radius:3px;font-weight:700}
.rank-num{display:inline-flex;width:18px;height:18px;border-radius:50%;align-items:center;justify-content:center;font-size:8px;font-weight:900;color:#000}
.tgt-wrap{display:flex;align-items:center;gap:8px;background:var(--card2);padding:6px 10px;border-radius:6px;border:1px solid var(--bdr);margin-top:4px}
.tgt-wrap:focus-within{border-color:var(--a);box-shadow:0 0 8px rgba(251,191,36,.15)}
.tgt-input{width:80px;padding:4px 6px;border-radius:4px;font-size:12px;font-weight:700;font-family:inherit;background:transparent;color:var(--a);border:none;text-align:right;outline:none}
.tgt-ret{font-size:14px;font-weight:900;min-width:70px;text-align:right}
.tgt-bar{height:4px;border-radius:2px;margin-top:4px;background:var(--bdr);overflow:hidden;position:relative}
.tgt-bar .tgt-fill{position:absolute;height:100%;border-radius:2px;transition:width .2s,left .2s}
.metric-bar{display:flex;align-items:center;gap:4px;margin:3px 0}
.metric-bar .mb-label{font-size:7px;color:var(--dim);width:28px;flex-shrink:0;text-align:right}
.metric-bar .mb-track{flex:1;height:8px;background:var(--bdr);border-radius:4px;overflow:hidden}
.metric-bar .mb-fill{height:100%;border-radius:4px;transition:width .3s}
.metric-bar .mb-val{font-size:8px;font-weight:700;width:38px;text-align:right;flex-shrink:0}
.hm-cell{padding:8px 4px;border-radius:6px;text-align:center;transition:transform .15s;cursor:default}
.hm-cell:hover{transform:scale(1.05)}
.hm-cell .hm-nm{font-size:8px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.hm-cell .hm-val{font-size:12px;font-weight:900;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);margin-top:1px}
.hm-cell .hm-etf{font-size:6px;color:rgba(255,255,255,.7);margin-top:1px}
.beta-badge{font-size:7px;padding:1px 5px;border-radius:3px;font-weight:800;display:inline-block;margin-left:3px;letter-spacing:.3px}
.ft{text-align:center;padding:8px 0;font-size:7px;color:var(--dim);border-top:1px solid var(--bdr);margin-top:10px}
.hide{display:none!important}
@media(max-width:640px){
  .w{padding:6px}.hd h1{font-size:11px}.hd .rv .vl{font-size:13px}
  .g2{grid-template-columns:1fr}.ag{grid-template-columns:1fr 1fr}
  .tbl{font-size:8px}.sg .nm{font-size:16px}.cd{padding:8px}
  .tb button{padding:5px 8px;font-size:8px}.topbar input{width:120px}
  .cc{height:120px}
}
@media(max-width:380px){.ag{grid-template-columns:1fr}.g3{grid-template-columns:1fr 1fr}.hd{flex-direction:column;align-items:flex-start}.hd .rv{text-align:left}}
</style>
</head>
<body>
<div class="w">
  <div class="topbar">
    <div class="row1">
      <div class="status" id="statusArea"><span class="dot dot-off"></span>API 키를 입력하세요</div>
      <div class="quota" id="quotaArea">잔여: —/25</div>
    </div>
    <div class="acts">
      <input id="apiKey" type="text" placeholder="Alpha Vantage API Key" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button class="btn btn-g" id="btnFetch">🔄 전체 스캔</button>
      <a href="https://www.alphavantage.co/support/#api-key" target="_blank" class="btn btn-b" style="text-decoration:none;font-size:8px">무료키</a>
    </div>
  </div>
  <div class="prog hide" id="progArea">
    <div class="bar"><div class="fill" id="progFill" style="width:0%"></div></div>
    <div class="info"><span id="progText">준비 중...</span><span id="progPct">0%</span></div>
  </div>
  <div id="errArea"></div>
  <div class="hd">
    <div><h1>PORTFOLIO COMMAND CENTER</h1><div class="sub" id="hSub">7 Holdings · S&P 500 Scanner</div></div>
    <div class="rv"><div class="lb">PORTFOLIO 3M AVG</div><div class="vl" id="hAvg">—</div></div>
  </div>
  <div class="st" id="strip"></div>
  <div class="tb" id="tabs"></div>
  <div id="pSignal"></div>
  <div id="pTarget" class="hide"></div>
  <div id="pPort" class="hide"></div>
  <div id="pRec" class="hide"></div>
  <div id="pSector" class="hide"></div>
  <div class="ft">⚠ 본 대시보드는 투자 조언이 아닙니다. 과거 데이터 기반 분석이며 미래 수익을 보장하지 않습니다.<br>S&P 500 대표 53종목 + GICS 11섹터 ETF · Alpha Vantage Free: 25 calls/day</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script>
// ═══════════════════════════════════════════════
// DATA DEFINITIONS
// ═══════════════════════════════════════════════
var MYPORT = ["NVDA","TSM","MU","CEG","SOXL","IONQ","CRCL"];
var TC = {NVDA:"#76B900",TSM:"#E4002B",MU:"#FDB515",CEG:"#00A3E0",SOXL:"#FF6B35",IONQ:"#7B2D8E",CRCL:"#3498DB"};
var NAMES = {NVDA:"NVIDIA",TSM:"Taiwan Semi",MU:"Micron",CEG:"Constellation Energy",SOXL:"Direxion Semi 3X",IONQ:"IonQ",CRCL:"Circle Internet"};
var PORT_SEC = {NVDA:"정보기술",TSM:"정보기술",MU:"정보기술",CEG:"유틸리티",SOXL:"레버리지ETF",IONQ:"정보기술",CRCL:"금융"};
var ALLOC_W = {NVDA:25,TSM:18,MU:18,CEG:12,SOXL:12,IONQ:8,CRCL:7};

// ── GICS 11 Sector ETFs ──
var SMAP = [
  {id:"IT",nm:"정보기술",etf:"XLK",co:"#3b82f6",st:["AAPL","MSFT","AVGO","CRM","ADBE"]},
  {id:"HC",nm:"헬스케어",etf:"XLV",co:"#10b981",st:["UNH","LLY","ABBV","MRK","PFE"]},
  {id:"FN",nm:"금융",etf:"XLF",co:"#f59e0b",st:["JPM","GS","V","MA","BAC"]},
  {id:"CD",nm:"경기소비재",etf:"XLY",co:"#ef4444",st:["AMZN","TSLA","HD","MCD","NKE"]},
  {id:"CS",nm:"커뮤니케이션",etf:"XLC",co:"#8b5cf6",st:["GOOGL","META","NFLX","DIS","TMUS"]},
  {id:"IN",nm:"산업재",etf:"XLI",co:"#6366f1",st:["CAT","HON","GE","RTX","UPS"]},
  {id:"CP",nm:"필수소비재",etf:"XLP",co:"#14b8a6",st:["PG","KO","COST","WMT","PEP"]},
  {id:"EN",nm:"에너지",etf:"XLE",co:"#f97316",st:["XOM","CVX","COP","SLB","EOG"]},
  {id:"UT",nm:"유틸리티",etf:"XLU",co:"#06b6d4",st:["NEE","DUK","SO","AEP"]},
  {id:"RE",nm:"부동산",etf:"XLRE",co:"#ec4899",st:["AMT","PLD","CCI","EQIX","SPG"]},
  {id:"MT",nm:"소재",etf:"XLB",co:"#84cc16",st:["LIN","APD","FCX","NEM","SHW"]}
];

// Build flat lists
var SETFS = []; // sector ETFs
var SP5 = [];   // S&P 500 candidate stocks (excluding portfolio)
var SP5_INFO = {}; // ticker -> {n:name, sec:sector}
for (var si=0;si<SMAP.length;si++){
  SETFS.push(SMAP[si].etf);
  SP5_INFO[SMAP[si].etf] = {n:SMAP[si].nm+" ETF",sec:SMAP[si].nm};
  for(var sj=0;sj<SMAP[si].st.length;sj++){
    var tk=SMAP[si].st[sj];
    if(MYPORT.indexOf(tk)<0){SP5.push(tk)}
    SP5_INFO[tk]={n:tk,sec:SMAP[si].nm};
  }
}
// Add friendly names
var FN={"AAPL":"Apple","MSFT":"Microsoft","AVGO":"Broadcom","CRM":"Salesforce","ADBE":"Adobe","UNH":"UnitedHealth","LLY":"Eli Lilly","ABBV":"AbbVie","MRK":"Merck","PFE":"Pfizer","JPM":"JPMorgan","GS":"Goldman Sachs","V":"Visa","MA":"Mastercard","BAC":"BofA","AMZN":"Amazon","TSLA":"Tesla","HD":"Home Depot","MCD":"McDonald's","NKE":"Nike","GOOGL":"Alphabet","META":"Meta","NFLX":"Netflix","DIS":"Disney","TMUS":"T-Mobile","CAT":"Caterpillar","HON":"Honeywell","GE":"GE Aerospace","RTX":"RTX Corp","UPS":"UPS","PG":"P&G","KO":"Coca-Cola","COST":"Costco","WMT":"Walmart","PEP":"PepsiCo","XOM":"ExxonMobil","CVX":"Chevron","COP":"ConocoPhillips","SLB":"Schlumberger","EOG":"EOG Resources","NEE":"NextEra","DUK":"Duke Energy","SO":"Southern Co","AEP":"AEP","AMT":"American Tower","PLD":"Prologis","CCI":"Crown Castle","EQIX":"Equinix","SPG":"Simon Property","LIN":"Linde","APD":"Air Products","FCX":"Freeport","NEM":"Newmont","SHW":"Sherwin-Williams"};
for(var fk in FN){if(SP5_INFO[fk])SP5_INFO[fk].n=FN[fk]}

var FC = [
  {t:"NVDA",lo:220,hi:280,g:"Bullish",cat:"Vera Rubin 출시, 데이터센터 성장"},
  {t:"TSM",lo:370,hi:440,g:"Bullish",cat:"AI 칩 풀가동, 미국 팹 확장"},
  {t:"MU",lo:380,hi:480,g:"Cautious",cat:"HBM3E 양산, 사이클 고점 주의"},
  {t:"CEG",lo:300,hi:400,g:"Moderate",cat:"Calpine 시너지, 전력 장기계약"},
  {t:"SOXL",lo:45,hi:100,g:"High Risk",cat:"반도체 3배 레버리지"},
  {t:"IONQ",lo:35,hi:75,g:"Speculative",cat:"매출 가속, SkyWater 인수"},
  {t:"CRCL",lo:70,hi:140,g:"Recovery",cat:"USDC 확대, 규제 명확화"}
];
var EV = [
  {d:"12/18",t:"MU",e:"Q1 EPS $4.78 (+20.7%)"},{d:"01/07",t:"NVDA",e:"Vera Rubin 공개"},
  {d:"01/08",t:"CEG",e:"Calpine 인수 $16.4B"},{d:"01/16",t:"TSM",e:"Q4 매출 상회"},
  {d:"01/27",t:"NVDA",e:"DeepSeek AI 효율성 우려"},{d:"01/30",t:"MU",e:"52주 신고가"},
  {d:"02/06",t:"CEG",e:"Q4 EPS $2.30"},{d:"02/24",t:"TSM",e:"AMD-Meta 칩 공급"},
  {d:"02/25",t:"IONQ",e:"Q4 매출 $61.9M (+429%)"},{d:"02/25",t:"CRCL",e:"Q4 EPS +35.5%"},
  {d:"02/26",t:"NVDA",e:"Q4 $68.1B 상회 (당일 -5.5%)"},{d:"02/26",t:"IONQ",e:"SkyWater 인수 +21.7%"}
];

// ═══════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════
var sel = "NVDA", tab = "signal", ca = 5;
var ut = {NVDA:250,TSM:420,MU:460,CEG:380,SOXL:85,IONQ:60,CRCL:120};
var charts = {};
var TD = {};       // All ticker data: { AAPL: {daily,summary,supply,ts} }
var isFetching = false;
var API_DELAY = 13000;
var DAILY_LIMIT = 25;

// ═══════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════
function pf(n,d){return n==null?"—":n.toFixed(d==null?2:d)}
function pp(n){return(n>=0?"+":"")+(n*100).toFixed(1)+"%"}
function pc(n){return n>=0?"cg":"cr"}
function pcs(n){return n>=0?"var(--g)":"var(--r)"}
function $(id){return document.getElementById(id)}
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v))}
function killChart(id){if(charts[id]){try{charts[id].destroy()}catch(e){}delete charts[id]}}
function hasChart(){return typeof Chart!=="undefined"}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
function showErr(msg){var el=$("errArea");el.innerHTML='<div class="errlog">⚠ '+msg+'</div>';setTimeout(function(){el.innerHTML=""},8000)}
function safeSave(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function safeLoad(k){try{return localStorage.getItem(k)}catch(e){return null}}

function getQuota(){
  var today=new Date().toISOString().slice(0,10);
  var d=safeLoad("av_date");
  if(d!==today){safeSave("av_date",today);safeSave("av_used","0");return 0}
  return parseInt(safeLoad("av_used")||"0");
}
function addQuota(n){safeSave("av_used",String(getQuota()+n))}
function updateQuotaUI(){var u=getQuota();$("quotaArea").textContent="잔여: "+(DAILY_LIMIT-u)+"/"+DAILY_LIMIT}

function isCachedToday(tk){
  if(!TD[tk]||!TD[tk].ts)return false;
  var cd=new Date(TD[tk].ts).toISOString().slice(0,10);
  return cd===new Date().toISOString().slice(0,10);
}
function cacheAge(tk){
  if(!TD[tk]||!TD[tk].ts)return "미스캔";
  var h=Math.round((Date.now()-TD[tk].ts)/3600000);
  if(h<1)return "방금";if(h<24)return h+"시간 전";
  var d=Math.round(h/24);return d+"일 전";
}

// Save/Load TD to localStorage
function saveTD(){
  try{var s={};for(var k in TD){s[k]={summary:TD[k].summary,supply:TD[k].supply,daily:TD[k].daily,ts:TD[k].ts}}safeSave("td_cache",JSON.stringify(s))}catch(e){}
}
function loadTD(){
  try{var s=safeLoad("td_cache");if(s){var p=JSON.parse(s);for(var k in p)TD[k]=p[k]}}catch(e){}
}

// ═══════════════════════════════════════════════
// ALPHA VANTAGE FETCH
// ═══════════════════════════════════════════════
function fetchTicker(ticker,apiKey){
  var url="https://www.alphavantage.co/query?function=TIME_SERIES_DAILY&symbol="+ticker+"&outputsize=compact&apikey="+apiKey;
  return fetch(url).then(function(r){
    if(!r.ok)throw new Error(ticker+" HTTP "+r.status);return r.json();
  }).then(function(json){
    if(json["Error Message"])throw new Error("잘못된 티커: "+ticker);
    if(json["Note"])throw new Error("RATE_LIMIT");
    if(json["Information"])throw new Error("DAILY_LIMIT");
    var ts=json["Time Series (Daily)"];
    if(!ts)throw new Error(ticker+": 데이터 없음");
    var dates=Object.keys(ts).sort(),raw=[];
    for(var i=0;i<dates.length;i++){var d=ts[dates[i]];raw.push({date:dates[i],d:dates[i].substring(5).replace("-","/"),o:parseFloat(d["1. open"]),h:parseFloat(d["2. high"]),l:parseFloat(d["3. low"]),c:parseFloat(d["4. close"]),v:parseInt(d["5. volume"])})}
    var days=raw.slice(-65);
    for(var j=0;j<days.length;j++){
      var s5=0,c5=0,s20=0,c20=0;
      for(var k=Math.max(0,j-4);k<=j;k++){s5+=days[k].c;c5++}
      for(var k2=Math.max(0,j-19);k2<=j;k2++){s20+=days[k2].c;c20++}
      days[j].ma5=c5>=5?Math.round(s5/c5*100)/100:days[j].c;
      days[j].ma20=c20>=20?Math.round(s20/c20*100)/100:days[j].c;
    }
    var chart20=days.slice(-20).map(function(d){return{d:d.d,c:d.c,a:d.ma5,b:d.ma20}});
    var last=days[days.length-1],first=days[0];
    var ret3m=(last.c-first.c)/first.c;
    var recent5=days.slice(-5),prev20=days.slice(-25,-5);
    var rA=0,pA=0;
    for(var r1=0;r1<recent5.length;r1++)rA+=recent5[r1].v;rA/=recent5.length;
    for(var r2=0;r2<prev20.length;r2++)pA+=prev20[r2].v;pA/=Math.max(prev20.length,1);
    var vc=pA>0?(rA-pA)/pA:0;
    var c20d=days.slice(-20),pCh=[],vCh=[];
    for(var p=1;p<c20d.length;p++){pCh.push((c20d[p].c-c20d[p-1].c)/c20d[p-1].c);vCh.push(c20d[p].v)}
    var aP=0,aV=0;for(var q=0;q<pCh.length;q++){aP+=pCh[q];aV+=vCh[q]}aP/=pCh.length;aV/=vCh.length;
    var cv=0,vP=0,vV=0;for(var q2=0;q2<pCh.length;q2++){cv+=(pCh[q2]-aP)*(vCh[q2]-aV);vP+=(pCh[q2]-aP)*(pCh[q2]-aP);vV+=(vCh[q2]-aV)*(vCh[q2]-aV)}
    var corr=(vP>0&&vV>0)?cv/Math.sqrt(vP*vV):0;
    var judge;
    if(vc>0.3&&corr>0.2)judge="강한 매수세";else if(vc>0.1&&corr>0)judge="매수 우위";
    else if(vc>0.2&&corr<-0.1)judge="강한 매도세";else if(vc>0&&corr<0)judge="매도 우위";else judge="중립";
    var nm=NAMES[ticker]||(SP5_INFO[ticker]?SP5_INFO[ticker].n:ticker);
    var sec=PORT_SEC[ticker]||(SP5_INFO[ticker]?SP5_INFO[ticker].sec:"기타");
    return{daily:chart20,summary:{t:ticker,n:nm,s:sec,p:last.c,r:ret3m,lastDate:last.date},supply:{t:ticker,vc:Math.round(vc*1000)/1000,co:Math.round(corr*1000)/1000,j:judge},ts:Date.now()};
  });
}

function buildQueue(){
  var q=[];
  // Phase 1: Portfolio (always refresh)
  for(var i=0;i<MYPORT.length;i++)q.push({t:MYPORT[i],ph:"포트폴리오"});
  // Phase 2: Sector ETFs (if not cached today)
  for(var j=0;j<SETFS.length;j++){
    if(!isCachedToday(SETFS[j]))q.push({t:SETFS[j],ph:"섹터ETF"});
  }
  // Phase 3: S&P 500 stocks (uncached first, then stale)
  var uncached=[],stale=[];
  for(var k=0;k<SP5.length;k++){
    if(!TD[SP5[k]])uncached.push(SP5[k]);
    else if(!isCachedToday(SP5[k]))stale.push(SP5[k]);
  }
  var extras=uncached.concat(stale);
  for(var m=0;m<extras.length;m++)q.push({t:extras[m],ph:"S&P500"});
  return q;
}

function startFullScan(){
  var apiKey=$("apiKey").value.trim();
  if(!apiKey){showErr("Alpha Vantage API 키를 입력하세요.");return}
  if(isFetching)return;
  isFetching=true;

  var btn=$("btnFetch");btn.disabled=true;btn.textContent="⏳ 스캔 중...";
  var prog=$("progArea");prog.classList.remove("hide");
  var fill=$("progFill"),text=$("progText"),pctEl=$("progPct"),status=$("statusArea");
  $("errArea").innerHTML="";
  status.innerHTML='<span class="dot dot-load"></span>스캔 진행 중...';

  var queue=buildQueue();
  var used=getQuota();
  var maxCalls=DAILY_LIMIT-used;
  if(maxCalls<=0){showErr("오늘의 API 한도(25회)를 모두 사용했습니다. 내일 다시 시도하세요.");btn.disabled=false;btn.textContent="🔄 전체 스캔";isFetching=false;prog.classList.add("hide");return}
  var toScan=queue.slice(0,maxCalls);
  var idx=0,errors=[],scanned=0;

  function doNext(){
    if(idx>=toScan.length){
      fill.style.width="100%";pctEl.textContent="100%";
      var ts=new Date().toLocaleString("ko-KR",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
      if(errors.length>0){text.textContent="일부 오류";status.innerHTML='<span class="dot dot-off"></span>부분 업데이트 · '+ts;showErr(errors.join(" / "))}
      else{text.textContent="✅ 스캔 완료! ("+scanned+"종목)";status.innerHTML='<span class="dot dot-live"></span>LIVE · '+ts}
      safeSave("av_key",apiKey);updateQuotaUI();
      btn.disabled=false;btn.textContent="🔄 전체 스캔";isFetching=false;
      saveTD();
      setTimeout(function(){prog.classList.add("hide")},3000);
      render();return;
    }
    var item=toScan[idx];
    var pv=Math.round((idx/toScan.length)*100);
    fill.style.width=pv+"%";pctEl.textContent=pv+"%";
    text.textContent=item.ph+" · "+item.t+" ("+(idx+1)+"/"+toScan.length+")";

    fetchTicker(item.t,apiKey).then(function(data){
      TD[item.t]=data;scanned++;addQuota(1);updateQuotaUI();
    }).catch(function(err){
      if(err.message==="RATE_LIMIT"){text.textContent="⏱ 분당 한도 도달. 20초 대기...";idx--;setTimeout(function(){idx++;doNext()},20000);return}
      if(err.message==="DAILY_LIMIT"){errors.push("일일 한도 초과");idx=toScan.length;doNext();return}
      errors.push(item.t+":"+err.message);
    }).then(function(){
      idx++;
      if(idx<toScan.length){
        var wait=API_DELAY;
        text.textContent="다음 대기 ("+Math.round(wait/1000)+"초)";
        setTimeout(doNext,wait);
      }else{doNext()}
    });
  }
  doNext();
}

// SCORING ENGINE
// ═══════════════════════════════════════════════
function scoreOne(tk,isPort){
  var d=TD[tk];if(!d||!d.daily||d.daily.length<3)return null;
  var dy=d.daily,sp=d.supply,sm=d.summary;
  var L=dy[dy.length-1],P=dy[dy.length-2];
  var p=L.c,m5=L.a,m20=L.b;
  var gc=m5>m20,dc=m5<m20;var pgc=P.a<=P.b,pdc=P.a>=P.b;

  var tech=0;
  if(gc&&pgc)tech+=40;else if(gc)tech+=20;
  if(dc&&pdc)tech-=40;else if(dc)tech-=20;
  if(p>m5&&p>m20)tech+=20;else if(p<m5&&p<m20)tech-=20;
  var mom=0;for(var k=dy.length-5;k<dy.length;k++){if(k>0)mom+=(dy[k].c-dy[k-1].c)/dy[k-1].c}
  tech+=Math.round((mom/5)*500);tech=clamp(tech,-100,100);

  var supS=0;
  if(sp.j==="강한 매수세")supS=70;else if(sp.j==="매수 우위")supS=40;
  else if(sp.j==="강한 매도세")supS=-70;else if(sp.j==="매도 우위")supS=-40;
  supS+=Math.round(sp.vc*20)+Math.round(sp.co*30);supS=clamp(supS,-100,100);

  var evS=0;
  if(isPort){
    var evts=[];for(var e=0;e<EV.length;e++){if(EV[e].t===tk)evts.push(EV[e])}evts=evts.slice(-3);
    for(var e2=0;e2<evts.length;e2++){var txt=evts[e2].e;if(/급등|상회|신고가|인수|확대|공개/.test(txt))evS+=25;else if(/급락|하락|우려|하향/.test(txt))evS-=25;else evS+=10}
    evS=clamp(evS,-100,100);
  }

  var comp;
  if(isPort)comp=Math.round(tech*.4+supS*.35+evS*.25);
  else comp=Math.round(tech*.55+supS*.45);

  var sig,sigC;
  if(comp>=50){sig="강력매수";sigC="#00ff88"}else if(comp>=20){sig="매수";sigC="#00d4aa"}
  else if(comp>=-20){sig="관망";sigC="#fbbf24"}else if(comp>=-50){sig="매도";sigC="#ff4757"}
  else{sig="강력매도";sigC="#ff0044"}

  var maSt=gc?"골든크로스":dc?"데드크로스":"—";
  var maC=gc?"var(--g)":dc?"var(--r)":"var(--dim)";
  var dm5=m5>0?Math.round((p-m5)/m5*1000)/10:0;
  var dm20=m20>0?Math.round((p-m20)/m20*1000)/10:0;

  return{t:tk,n:sm.n,s:sm.s,p:sm.p,r:sm.r,tech:tech,sup:supS,ev:evS,comp:comp,sig:sig,sigC:sigC,maSt:maSt,maC:maC,dm5:dm5,dm20:dm20,supJ:sp.j,vc:sp.vc,co:sp.co,fc:null,ts:d.ts};
}

function calcPortSigs(){
  var out=[];
  for(var i=0;i<MYPORT.length;i++){
    var s=scoreOne(MYPORT[i],true);
    if(!s){out.push({t:MYPORT[i],n:NAMES[MYPORT[i]]||MYPORT[i],s:PORT_SEC[MYPORT[i]]||"",noData:true});continue}
    for(var fi=0;fi<FC.length;fi++){if(FC[fi].t===s.t){s.fc=FC[fi];break}}
    out.push(s);
  }
  return out;
}

function calcAllSP5Sigs(){
  var all=[];
  // Include portfolio stocks that are in S&P 500
  var sp500tickers=["NVDA","TSM","MU","CEG"];
  for(var i=0;i<sp500tickers.length;i++){
    var s=scoreOne(sp500tickers[i],false);
    if(s){s.inPort=true;all.push(s)}
  }
  // S&P 500 candidates
  for(var j=0;j<SP5.length;j++){
    var s2=scoreOne(SP5[j],false);
    if(s2){s2.inPort=false;all.push(s2)}
  }
  all.sort(function(a,b){return b.comp-a.comp});
  return all;
}

function calcSectorSigs(){
  var out=[];
  for(var i=0;i<SMAP.length;i++){
    var sm=SMAP[i],etf=sm.etf;
    var s=scoreOne(etf,false);
    var stockScores=[];
    for(var j=0;j<sm.st.length;j++){
      var ss=scoreOne(sm.st[j],false);
      if(ss)stockScores.push(ss);
    }
    out.push({id:sm.id,nm:sm.nm,etf:etf,co:sm.co,score:s,stocks:stockScores,stockTickers:sm.st});
  }
  out.sort(function(a,b){
    var sa=a.score?a.score.comp:-999,sb=b.score?b.score.comp:-999;
    return sb-sa;
  });
  return out;
}

function betaBadge(tk){
  if(typeof BETA_MAP==="undefined"||!BETA_MAP[tk])return'<span class="beta-badge" style="background:#475569;color:#94a3b8">β —</span>';
  var b=BETA_MAP[tk];
  var bg,fg;
  if(b<0.8){bg="rgba(59,130,246,.2)";fg="#60a5fa"}       // 방어적 (blue)
  else if(b<=1.2){bg="rgba(0,212,170,.2)";fg="#00d4aa"}   // 중립 (green)
  else if(b<=1.5){bg="rgba(251,191,36,.2)";fg="#fbbf24"}  // 보통 (yellow)

  return'<span class="beta-badge" style="background:'+bg+';color:'+fg+'">β '+b.toFixed(2)+'</span>';
}

function rSector(){
  var sectors=calcSectorSigs();

  if(!anyData){$("pSector").innerHTML=noDataMsg("섹터 ETF 스캔이 필요합니다");return}

  h+='<div class="bx" style="flex:1;min-width:70px;text-align:center"><div class="lb">↗ 유입</div><div class="vl cg">'+sectors.filter(function(s){return s.score&&s.score.comp>=20&&s.score.comp<50}).length+'</div></div>';
  h+='<div class="bx" style="flex:1;min-width:70px;text-align:center"><div class="lb">↔ 중립</div><div class="vl ca">'+sectors.filter(function(s){return s.score&&s.score.comp>-20&&s.score.comp<20}).length+'</div></div>';
  h+='<div class="bx" style="flex:1;min-width:70px;text-align:center"><div class="lb">↘ 유출</div><div class="vl cr">'+sectors.filter(function(s){return s.score&&s.score.comp<=-20}).length+'</div></div>';
  h+='</div></div>';

  // ─── 히트맵 그리드 ───
  h+='<div class="cd"><div class="ct">◎ 섹터 히트맵 <span style="font-size:7px;color:var(--dim);font-weight:400">종합점수 기반 색상 강도</span></div>';
  h+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px">';
  for(var hi=0;hi<sectors.length;hi++){

  }
  h+='</div></div>';

  // ─── 섹터 강도 랭킹 (가로 막대 그래프 포함) ───
  h+='<div class="cd"><div class="ct">◎ 섹터 강도 랭킹</div>';
  for(var i=0;i<sectors.length;i++){

    // Sector stocks
    if(sc.stocks.length>0){
      h+='<div style="margin-top:5px;display:flex;gap:4px;flex-wrap:wrap">';

        var st=sc.stocks[j];

    h+='</div>';
  }
  h+='</div>';

  // Sector bar chart (Chart.js)
  h+='<div class="cd"><div class="ct">◎ 섹터 종합점수 차트</div><div class="cc" style="height:180px"><canvas id="cSector"></canvas></div></div>';

  // Rotation cycle reference
  h+='<div class="cd"><div class="ct">◎ 경기 순환 참고</div><div style="font-size:8px;line-height:1.8;color:var(--dim)">';
  h+='<div style="margin-bottom:3px"><span style="color:var(--g)">▸ 회복기 (Early)</span> — 금융, 경기소비재, 산업재</div>';
  h+='<div style="margin-bottom:3px"><span style="color:var(--b)">▸ 확장기 (Mid)</span> — 정보기술, 커뮤니케이션, 소재</div>';
  h+='<div style="margin-bottom:3px"><span style="color:var(--a)">▸ 후기 (Late)</span> — 에너지, 필수소비재, 헬스케어</div>';
  h+='<div><span style="color:var(--r)">▸ 침체기 (Recession)</span> — 유틸리티, 헬스케어, 필수소비재</div>';
  h+='</div></div>';

  $("pSector").innerHTML=h;

  // Sector chart
  killChart("sector");
  setTimeout(function(){
    var cv=$("cSector");if(!cv)return;
    var labels=[],data=[],colors=[],borderColors=[];
    for(var k=0;k<sectors.length;k++){
      if(!sectors[k].score)continue;
      labels.push(sectors[k].nm);
      data.push(sectors[k].score.comp);
      var c=sectors[k].score.comp>=0?"rgba(0,212,170,0.6)":"rgba(255,71,87,0.6)";
      var bc=sectors[k].score.comp>=0?"rgba(0,212,170,1)":"rgba(255,71,87,1)";
      colors.push(c);borderColors.push(bc);
    }
    if(hasChart()){charts.sector=new Chart(cv,{type:"bar",data:{labels:labels,datasets:[{label:"종합점수",data:data,backgroundColor:colors,borderColor:borderColors,borderWidth:1,borderRadius:3}]},options:{indexAxis:"y",responsive:true,maintainAspectRatio:false,animation:{duration:300},plugins:{legend:{display:false},tooltip:{callbacks:{label:function(ctx){return"종합: "+(ctx.raw>0?"+":"")+ctx.raw}}}},scales:{x:{ticks:{color:"#64748b",font:{size:7}},grid:{color:"#1e293b22"},min:-100,max:100},y:{ticks:{color:"#94a3b8",font:{size:8,weight:"bold"}},grid:{display:false}}}}});}
  },100);
}

// ═══════════════════════════════════════════════
// MAIN RENDER
// ═══════════════════════════════════════════════
function rHdr(){
  var avg=0,cnt=0;
  for(var i=0;i<MYPORT.length;i++){if(TD[MYPORT[i]]&&TD[MYPORT[i]].summary){avg+=TD[MYPORT[i]].summary.r;cnt++}}
  avg=cnt>0?avg/cnt:0;
  var h=$("hAvg");h.textContent=cnt>0?pp(avg):"—";h.className="vl "+pc(avg);
  var sub="7 Holdings · S&P 500";
  var portD=TD[MYPORT[0]];
  if(portD&&portD.summary)sub+=" · "+portD.summary.lastDate;
  $("hSub").textContent=sub;
}

function rStrip(){
  var el=$("strip");el.innerHTML="";
  for(var i=0;i<MYPORT.length;i++){
    (function(t){
      var b=document.createElement("button");
      var d=TD[t];var p=d?d.summary.p:0;var r=d?d.summary.r:0;
      var col=TC[t]||"var(--b)";
      if(t===sel){b.className="on";b.style.borderColor=col;var rgb=parseInt(col.slice(1,3),16)+","+parseInt(col.slice(3,5),16)+","+parseInt(col.slice(5,7),16);b.style.background="rgba("+rgb+",.1)";b.style.color=col}
      var rT=d?pp(r):"—";var rC=d?pcs(r):"var(--dim)";
      b.innerHTML="<div style='font-weight:700;color:"+(t===sel?col:"inherit")+"'>"+t+"</div><div style='font-size:8px;color:"+rC+"'>"+(d?"$"+pf(p,1):"—")+"</div>";
      b.addEventListener("click",function(){sel=t;render()});
      el.appendChild(b);
    })(MYPORT[i]);
  }
  var db=document.createElement("button");db.className="dum";
  db.innerHTML="<div>₿ BTC/XRP</div><div style='font-size:7px'>편입 예정</div>";
  el.appendChild(db);
}

function rTabs(){
  var el=$("tabs");el.innerHTML="";
  var items=[["signal","📊 시그널"],["target","🎯 목표가"],["portfolio","💼 배분"],["rec","🏆 추천종목"],["sector","🔄 순환매"]];
  for(var i=0;i<items.length;i++){
    (function(it){
      var b=document.createElement("button");b.textContent=it[1];
      if(tab===it[0])b.className="on";
      b.addEventListener("click",function(){tab=it[0];render()});
      el.appendChild(b);
    })(items[i]);
  }
}

function render(){
  rHdr();rStrip();rTabs();
  var panels=["pSignal","pTarget","pPort","pRec","pSector"];
  var tabMap={"signal":"pSignal","target":"pTarget","portfolio":"pPort","rec":"pRec","sector":"pSector"};
  for(var i=0;i<panels.length;i++){$(panels[i]).className=panels[i]===tabMap[tab]?"":"hide"}
  if(tab==="signal")rSignal();
  else if(tab==="target")rTarget();
  else if(tab==="portfolio")rPort();
  else if(tab==="rec")rRec();
  else if(tab==="sector")rSector();
}

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
function init(){
  loadTD();
  var saved=safeLoad("av_key");if(saved)$("apiKey").value=saved;
  updateQuotaUI();
  $("btnFetch").addEventListener("click",function(){startFullScan()});
  $("apiKey").addEventListener("keydown",function(e){if(e.key==="Enter"||e.keyCode===13){e.preventDefault();startFullScan()}});
  render();
}
if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",init)}else{init()}
</script>
</body>
