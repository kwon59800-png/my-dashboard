<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>QUANTUM PM · 모바일</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root {
  --bg:   #070709;
  --s1:   #0d0d12;
  --s2:   #111118;
  --s3:   #18181f;
  --s4:   #202028;
  --b1:   rgba(255,255,255,0.07);
  --b2:   rgba(255,255,255,0.045);
  --b3:   rgba(255,255,255,0.025);
  --t1:   #eeeef5;
  --t2:   #8686a8;
  --t3:   #3e3e58;
  --blue: #5b8dee;
  --b-lo: rgba(91,141,238,0.11);
  --b-md: rgba(91,141,238,0.18);
  --up:   #30d988;
  --up-lo:rgba(48,217,136,0.09);
  --dn:   #f05252;
  --dn-lo:rgba(240,82,82,0.09);
  --oj:   #f5a623;
  --oj-lo:rgba(245,166,35,0.09);
  --pu:   #9d6eff;
  --pu-lo:rgba(157,110,255,0.09);
  --cy:   #22d3ee;
  --cy-lo:rgba(34,211,238,0.09);
  --nav-h:  58px;
  --hdr-h:  52px;
  --font-sans: 'DM Sans', -apple-system, sans-serif;
  --font-brand:'Syne', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

html,body { height:100%; background:var(--bg); overflow:hidden; overscroll-behavior:none; }
body { font-family:var(--font-sans); color:var(--t1); -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width:2px; }
::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.07); border-radius:2px; }

/* ════════════════════════════════════
   HEADER
════════════════════════════════════ */
#hdr {
  height:var(--hdr-h); flex-shrink:0;
  background:var(--s1);
  border-bottom:1px solid var(--b1);
  display:flex; align-items:center;
  padding:0 16px; gap:10px;
  position:relative; z-index:50;
}
#hdr::after {
  content:''; position:absolute; bottom:0; left:0; right:0; height:1px;
  background:linear-gradient(90deg,var(--blue),transparent 50%); opacity:.5;
}
.hdr-logo {
  width:28px; height:28px; border-radius:7px;
  background:linear-gradient(135deg,var(--blue),#8b5cf6);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
  box-shadow:0 0 12px rgba(91,141,238,0.3);
}
.hdr-brand { font-family:var(--font-brand); font-size:13px; font-weight:700; letter-spacing:0.1em; }
.hdr-spacer { flex:1; }
#mktBadge {
  display:inline-flex; align-items:center; gap:4px;
  padding:2px 9px; border-radius:4px;
  font-size:9px; font-weight:600; font-family:var(--font-mono);
  letter-spacing:0.07em;
}
#mktBadge.pre  { background:rgba(157,110,255,0.12); color:#b99bff; border:1px solid rgba(157,110,255,0.2); }
#mktBadge.reg  { background:var(--up-lo); color:var(--up); border:1px solid rgba(48,217,136,0.18); }
#mktBadge.cls  { background:var(--s3); color:var(--t3); border:1px solid var(--b2); }
#mktBadgeDot { width:5px; height:5px; border-radius:50%; flex-shrink:0; }
#mktBadge.pre  #mktBadgeDot { background:#b99bff; animation:pulse .9s ease-in-out infinite; }
#mktBadge.reg  #mktBadgeDot { background:var(--up); box-shadow:0 0 4px var(--up); }
#mktBadge.cls  #mktBadgeDot { background:var(--t3); }
@keyframes pulse { 0%,100%{opacity:.3} 50%{opacity:1} }

.hdr-sync {
  width:30px; height:30px; border-radius:7px;
  background:var(--s3); border:1px solid var(--b2);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; color:var(--t2);
  transition:all .14s; flex-shrink:0;
}
.hdr-sync:active { background:var(--b-lo); color:var(--blue); }
#syncDot {
  width:6px; height:6px; border-radius:50%;
  background:var(--t3); flex-shrink:0;
  transition:background .4s, box-shadow .4s;
}
#syncDot.live { background:var(--up); box-shadow:0 0 6px var(--up); }
#syncDot.err  { background:var(--dn); }
#syncDot.spin { background:var(--oj); animation:pulse .8s linear infinite; }

/* ════════════════════════════════════
   PAGES CONTAINER
════════════════════════════════════ */
#pages {
  flex:1; overflow:hidden; position:relative;
}
.page {
  position:absolute; inset:0;
  overflow-y:auto; overflow-x:hidden;
  background:var(--bg);
  display:none; flex-direction:column;
  padding-bottom:calc(var(--nav-h) + 10px);
  -webkit-overflow-scrolling:touch;
}
.page.active { display:flex; }

/* ════════════════════════════════════
   BOTTOM NAV
════════════════════════════════════ */
#nav {
  height:var(--nav-h); flex-shrink:0;
  background:var(--s1);
  border-top:1px solid var(--b1);
  display:flex; align-items:center;
  padding:0 4px;
  padding-bottom:env(safe-area-inset-bottom);
  z-index:50;
}
.nav-btn {
  flex:1; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:3px;
  height:100%; cursor:pointer;
  color:var(--t3); transition:color .12s;
  border:none; background:none; padding:4px 0;
}
.nav-btn.active { color:var(--blue); }
.nav-btn svg { transition:transform .12s; flex-shrink:0; }
.nav-btn.active svg { transform:scale(1.05); }
.nav-lbl {
  font-size:9px; font-weight:600;
  font-family:var(--font-mono); letter-spacing:0.05em;
}

/* ════════════════════════════════════
   PAGE 1: OVERVIEW (포트폴리오)
════════════════════════════════════ */

/* Summary bar at top */
.sum-bar {
  background:var(--s1); border-bottom:1px solid var(--b2);
  padding:12px 16px; display:flex; gap:0; flex-shrink:0;
}
.sum-item {
  flex:1; display:flex; flex-direction:column; gap:1px;
  border-right:1px solid var(--b2); padding:0 12px;
}
.sum-item:first-child { padding-left:0; }
.sum-item:last-child  { border-right:none; padding-right:0; }
.sum-lbl { font-size:8.5px; font-weight:600; color:var(--t3); font-family:var(--font-mono); letter-spacing:0.1em; text-transform:uppercase; }
.sum-val { font-size:12px; font-weight:700; font-family:var(--font-mono); letter-spacing:-0.02em; }

/* Goal card */
.goal-card {
  margin:12px 14px 0;
  background:var(--s1); border:1px solid var(--b2); border-radius:12px;
  padding:14px 16px; position:relative; overflow:hidden;
}
.goal-card::before {
  content:''; position:absolute; top:0; left:0; right:0; height:2px;
  background:linear-gradient(90deg,var(--blue),#8b5cf6,var(--cy));
}
.goal-lbl { font-size:9px; font-weight:600; color:var(--t3); font-family:var(--font-mono); letter-spacing:0.1em; text-transform:uppercase; margin-bottom:6px; }
.goal-pct { font-family:var(--font-brand); font-size:48px; font-weight:800; letter-spacing:-0.04em; line-height:1.05; margin-bottom:12px; padding:4px 0 2px; }
.pb { height:4px; border-radius:100px; background:var(--s4); overflow:hidden; }
.pb-f { height:100%; border-radius:100px; transition:width 1.2s cubic-bezier(.4,0,.2,1); background:linear-gradient(90deg,var(--blue),#8b5cf6,var(--cy)); }
.goal-row { display:flex; gap:16px; margin-top:10px; }
.goal-mini-lbl { font-size:8.5px; color:var(--t3); font-family:var(--font-mono); letter-spacing:0.08em; text-transform:uppercase; margin-bottom:2px; }
.goal-mini-val { font-size:12px; font-weight:600; font-family:var(--font-mono); }

/* Metric grid */
.metric-grid {
  display:grid; grid-template-columns:1fr 1fr;
  gap:8px; margin:10px 14px 0;
}
.metric-card {
  background:var(--s1); border:1px solid var(--b2);
  border-radius:10px; padding:11px 13px;
  position:relative; overflow:hidden;
}
.metric-card::before {
  content:''; position:absolute; left:0; top:0; bottom:0; width:2.5px; border-radius:2px;
}
.mc-blue::before  { background:var(--blue); }
.mc-up::before    { background:var(--up); }
.mc-oj::before    { background:var(--oj); }
.mc-pu::before    { background:var(--pu); }
.mc-cy::before    { background:var(--cy); }
.mc-lbl { font-size:8.5px; font-weight:600; color:var(--t3); font-family:var(--font-mono); letter-spacing:0.1em; text-transform:uppercase; margin-bottom:5px; }
.mc-val { font-size:14px; font-weight:700; font-family:var(--font-mono); letter-spacing:-0.02em; }
.mc-sub { font-size:9.5px; color:var(--t3); font-family:var(--font-mono); margin-top:2px; }

/* ════════════════════════════════════
   PAGE 2: ASSETS (종목)
════════════════════════════════════ */
.sec-label {
  padding:10px 16px 6px;
  display:flex; align-items:center; gap:8px;
}
.sec-label-txt {
  font-size:10.5px; font-weight:700;
  font-family:var(--font-mono); letter-spacing:0.05em;
  color:var(--t1);
}
.sec-label-line { flex:1; height:1px; background:var(--b2); }
.sec-label-cnt {
  font-size:9px; font-weight:600;
  font-family:var(--font-mono);
  color:var(--blue); background:var(--b-lo);
  border:1px solid var(--b-md);
  padding:2px 7px; border-radius:4px;
}

/* Asset cards */
.ac {
  margin:0 14px 7px;
  background:var(--s1); border:1px solid var(--b2);
  border-radius:11px; padding:12px 13px;
  cursor:pointer; transition:border-color .12s;
  position:relative; overflow:hidden;
}
.ac::before {
  content:''; position:absolute; left:0; top:0; bottom:0;
  width:2.5px; border-radius:2px 0 0 2px;
  background:transparent; transition:background .12s;
}
.ac:active { border-color:var(--b1); }
.ac:active::before { background:var(--blue); }
.ac-top { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.ac-info { flex:1; min-width:0; }
.ac-sym { font-size:14px; font-weight:700; font-family:var(--font-mono); letter-spacing:0.03em; }
.ac-name { font-size:10px; color:var(--t2); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ac-right { text-align:right; flex-shrink:0; }
.ac-price { font-size:15px; font-weight:700; font-family:var(--font-mono); letter-spacing:-0.02em; }
.ac-price-sub { font-size:10px; color:var(--t3); font-family:var(--font-mono); margin-top:1px; }
.ac-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
.acg-item {}
.acg-lbl { font-size:8.5px; font-weight:600; color:var(--t3); font-family:var(--font-mono); letter-spacing:0.08em; text-transform:uppercase; margin-bottom:3px; }
.acg-val { font-size:12px; font-weight:600; font-family:var(--font-mono); letter-spacing:-0.02em; }
.ac-prog { height:3px; border-radius:100px; background:var(--s4); overflow:hidden; margin-top:10px; }
.ac-pf   { height:100%; border-radius:100px; transition:width 1.2s ease; }

/* Badges */
.bdg { display:inline-flex; align-items:center; font-size:10px; font-weight:600; font-family:var(--font-mono); padding:2px 7px; border-radius:4px; white-space:nowrap; letter-spacing:0.02em; }
.bdg-up  { background:var(--up-lo);  color:var(--up); }
.bdg-dn  { background:var(--dn-lo);  color:var(--dn); }
.bdg-pre { background:rgba(157,110,255,0.11); color:#b99bff; border:1px solid rgba(157,110,255,0.18); }
.bdg-post{ background:var(--cy-lo);  color:var(--cy); border:1px solid rgba(34,211,238,0.18); }
.bdg-bl  { background:var(--b-lo);   color:#7aa6ff; }

/* ════════════════════════════════════
   PAGE 3: AI / GEMINI
════════════════════════════════════ */
.ai-card {
  margin:14px 14px 0;
  background:var(--s1); border:1px solid var(--b2);
  border-radius:12px; overflow:hidden;
}
.ai-card-hd {
  padding:12px 14px 10px;
  border-bottom:1px solid var(--b2);
  display:flex; align-items:center; justify-content:space-between;
}
.ai-card-ttl { font-size:11px; font-weight:700; font-family:var(--font-mono); letter-spacing:0.04em; }
.ai-card-body { padding:12px 14px; }
.ai-text { font-size:12px; line-height:1.9; color:var(--t2); word-break:keep-all; }
.phb-pu { font-size:8.5px; font-weight:700; font-family:var(--font-mono); padding:2px 7px; border-radius:4px; letter-spacing:0.1em; background:var(--pu-lo); color:var(--pu); border:1px solid rgba(157,110,255,0.18); }
.ai-refresh-btn {
  display:flex; align-items:center; gap:6px;
  padding:8px 14px; border-radius:8px;
  background:var(--b-lo); border:1px solid var(--b-md);
  color:var(--blue); font-size:11px; font-weight:600;
  font-family:var(--font-mono); cursor:pointer;
  margin:0 14px 8px; transition:all .12s; width:calc(100% - 28px);
  justify-content:center; letter-spacing:0.04em;
}
.ai-refresh-btn:active { background:var(--b-md); }

/* Rank list in AI page */
.rank-item {
  display:flex; align-items:center; gap:9px;
  padding:10px 14px;
  border-bottom:1px solid var(--b2);
}
.rank-item:last-child { border-bottom:none; }
.rank-med { font-size:13px; width:22px; flex-shrink:0; text-align:center; }
.rank-info { flex:1; min-width:0; }
.rank-sym { font-size:12px; font-weight:700; font-family:var(--font-mono); letter-spacing:0.03em; }
.rank-name { font-size:9.5px; color:var(--t3); margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* ════════════════════════════════════
   PAGE 4: CHART
════════════════════════════════════ */
.chart-card {
  margin:12px 14px 0;
  background:var(--s1); border:1px solid var(--b2);
  border-radius:12px; padding:14px;
}
.chart-card-hd { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.chart-card-ttl { font-size:11px; font-weight:700; font-family:var(--font-mono); letter-spacing:0.04em; }
.chart-card-sub { font-size:9.5px; color:var(--t3); font-family:var(--font-mono); margin-top:1px; }
.ctabs { display:flex; gap:5px; }
.ctab {
  font-size:9.5px; font-weight:600; font-family:var(--font-mono);
  padding:3px 9px; border-radius:5px; border:1px solid var(--b2);
  background:transparent; color:var(--t3); cursor:pointer;
  transition:all .12s; letter-spacing:0.02em;
}
.ctab.on { background:var(--b-lo); color:var(--blue); border-color:var(--b-md); }

.sector-card {
  margin:10px 14px 0;
  background:var(--s1); border:1px solid var(--b2); border-radius:12px; padding:14px;
}
.sector-hd { font-size:10px; font-weight:700; font-family:var(--font-mono); color:var(--t3); letter-spacing:0.1em; text-transform:uppercase; margin-bottom:10px; }
.sb { margin-bottom:11px; }
.sb:last-child { margin-bottom:0; }
.sb-hd { display:flex; justify-content:space-between; align-items:center; margin-bottom:5px; }
.sb-name { font-size:11px; font-weight:500; color:var(--t2); font-family:var(--font-mono); }
.sb-pct  { font-size:11px; font-weight:700; font-family:var(--font-mono); }
.sb-bar  { height:4px; border-radius:100px; background:var(--s4); overflow:hidden; }
.sb-fill { height:100%; border-radius:100px; transition:width 1.2s ease; }

/* ════════════════════════════════════
   PAGE 5: SETTINGS / 거래
════════════════════════════════════ */
.trade-card {
  margin:12px 14px 0;
  background:var(--s1); border:1px solid var(--b2); border-radius:12px; overflow:hidden;
}
.trade-hd { padding:11px 14px; border-bottom:1px solid var(--b2); display:flex; align-items:center; justify-content:space-between; }
.trade-ttl { font-size:11px; font-weight:700; font-family:var(--font-mono); letter-spacing:0.04em; }
.trade-add-btn {
  font-size:9.5px; font-weight:600; font-family:var(--font-mono);
  padding:4px 10px; border-radius:6px;
  background:var(--up-lo); border:1px solid rgba(48,217,136,0.22);
  color:var(--up); cursor:pointer; letter-spacing:0.04em;
}
.trade-item { display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--b2); }
.trade-item:last-child { border-bottom:none; }
.trade-empty { padding:20px 14px; text-align:center; font-size:11px; color:var(--t3); font-family:var(--font-mono); }

.settings-card {
  margin:12px 14px 0;
  background:var(--s1); border:1px solid var(--b2); border-radius:12px; overflow:hidden;
}
.settings-item {
  display:flex; align-items:center;
  padding:13px 16px; border-bottom:1px solid var(--b2); cursor:pointer;
  transition:background .12s;
}
.settings-item:last-child { border-bottom:none; }
.settings-item:active { background:var(--s3); }
.settings-ico { width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-right:11px; }
.settings-lbl { font-size:13px; font-weight:500; flex:1; }
.settings-val { font-size:11px; font-family:var(--font-mono); color:var(--t2); }

/* ════════════════════════════════════
   MODAL
════════════════════════════════════ */
.ov {
  position:fixed; inset:0;
  background:rgba(0,0,0,0.8); backdrop-filter:blur(8px);
  z-index:1000; display:none; align-items:flex-end; justify-content:center;
}
.ov.on { display:flex; }
.sheet {
  background:var(--s2); border:1px solid var(--b1);
  border-radius:18px 18px 0 0; width:100%; max-width:520px;
  max-height:85vh; display:flex; flex-direction:column;
  box-shadow:0 -16px 60px rgba(0,0,0,.7);
  padding-bottom:env(safe-area-inset-bottom);
}
.sheet-hd {
  padding:14px 20px 12px;
  border-bottom:1px solid var(--b2);
  flex-shrink:0; text-align:center;
  position:relative;
}
.sheet-hd::before {
  content:''; position:absolute; top:8px; left:50%; transform:translateX(-50%);
  width:32px; height:3px; background:var(--b1); border-radius:100px;
}
.sheet-ttl { font-size:14px; font-weight:700; font-family:var(--font-mono); letter-spacing:0.04em; margin-top:8px; }
.sheet-body { overflow-y:auto; padding:16px 20px; flex:1; -webkit-overflow-scrolling:touch; }
.fi {
  width:100%; padding:10px 12px; border-radius:8px;
  background:var(--s3); border:1px solid var(--b2);
  color:var(--t1); font-size:14px; font-family:var(--font-mono);
  outline:none; transition:border-color .12s;
}
.fi:focus { border-color:var(--blue); }
.fl { display:block; font-size:10px; color:var(--t3); font-family:var(--font-mono); letter-spacing:0.08em; text-transform:uppercase; margin-bottom:5px; }
.fbtn {
  width:100%; padding:12px; border-radius:10px;
  border:1px solid var(--b2); cursor:pointer;
  font-size:13px; font-weight:600; font-family:var(--font-mono);
  transition:all .12s; letter-spacing:0.04em;
}
.fbtn-primary { background:var(--blue); color:white; border-color:var(--blue); }
.fbtn-ghost { background:transparent; color:var(--t2); }
.fbtn-ghost:hover { background:var(--s3); }
.qa-info { font-size:11px; line-height:2; color:var(--t2); font-family:var(--font-mono); background:var(--s3); border:1px solid var(--b2); border-radius:8px; padding:10px 12px; margin-bottom:12px; white-space:pre-wrap; }

/* ════════════════════════════════════
   TOAST
════════════════════════════════════ */
.toast {
  position:fixed; bottom:calc(var(--nav-h) + 12px); left:50%;
  transform:translateX(-50%) translateY(40px);
  background:var(--s4); border:1px solid var(--b1);
  color:var(--t1); padding:8px 18px; border-radius:100px;
  font-size:11.5px; font-weight:500; font-family:var(--font-mono);
  z-index:9999; transition:all .2s cubic-bezier(.4,0,.2,1);
  opacity:0; white-space:nowrap; pointer-events:none;
  box-shadow:0 6px 20px rgba(0,0,0,.5); letter-spacing:0.02em;
}
.toast.on { transform:translateX(-50%) translateY(0); opacity:1; }

/* ════════════════════════════════════
   TICKER STRIP
════════════════════════════════════ */
#mTicker {
  height:26px; flex-shrink:0;
  background:var(--s1); border-bottom:1px solid var(--b2);
  overflow:hidden; position:relative;
}
#mTicker::before,#mTicker::after { content:''; position:absolute; top:0; bottom:0; width:30px; z-index:2; }
#mTicker::before { left:0; background:linear-gradient(90deg,var(--s1),transparent); }
#mTicker::after  { right:0; background:linear-gradient(-90deg,var(--s1),transparent); }
#mTickerInner {
  display:flex; align-items:center; gap:20px; height:100%; padding:0 12px;
  white-space:nowrap; width:max-content;
  animation:tickRun 36s linear infinite;
}
@keyframes tickRun { from{transform:translateX(0)} to{transform:translateX(-50%)} }
.tick { display:inline-flex; align-items:center; gap:4px; font-size:10px; font-family:var(--font-mono); }
.t-sym { color:var(--t2); font-weight:500; }
.t-px  { color:var(--t1); }
.t-ch  { font-weight:600; } .t-ch.u{color:var(--up)} .t-ch.d{color:var(--dn)}

/* API status */
#apiMsgM { display:none; padding:5px 14px; font-size:10px; font-weight:500; font-family:var(--font-mono); background:rgba(245,166,35,0.07); border-bottom:1px solid rgba(245,166,35,0.15); color:var(--oj); text-align:center; flex-shrink:0; letter-spacing:0.02em; }

/* Entrance animation */
.si { animation:siFade .3s ease both; }
@keyframes siFade { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }
</style>

const ALPHA_KEY = 'YBKJ9G0QO03XUJJ8';

/* ─── KST 시간 기반 세션 판별 ─── */
function getKstSession() {
  const kst  = new Date(Date.now() + 9*3600*1000);
  const tot  = kst.getUTCHours() * 60 + kst.getUTCMinutes();
  if      (tot >= 1410 || tot < 360)  return 'REGULAR'; /* 23:30 ~ 06:00 실시간 */
  else if (tot >= 1080 && tot < 1410) return 'PRE';     /* 18:00 ~ 23:30 프리장 */
  else                                return 'CLOSED';  /* 06:00 ~ 18:00 종가   */
}

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

function setApiMsg(msg) {
  const el = document.getElementById('apiMsg');
  if (el) { el.textContent = msg; el.style.display = msg ? 'block' : 'none'; }

/* ─── 전략 1~3: Yahoo Finance (CORS 프록시) ─── */
async function tryYahooProxy(proxyNum, syms) {
  /* Yahoo Finance v8 — crumb 없이도 작동하는 엔드포인트 */
  const base = 'https://query2.finance.yahoo.com/v8/finance/quote';
  const params = `?symbols=${syms}&fields=symbol,regularMarketPrice,regularMarketChangePercent,regularMarketChange,regularMarketPreviousClose,regularMarketTime,preMarketPrice,preMarketChangePercent,preMarketChange,postMarketPrice,postMarketChangePercent,postMarketChange,marketState,regularMarketDayHigh,regularMarketDayLow`;
  const target = base + params;

  let url;
  if      (proxyNum === 0) url = `https://corsproxy.io/?${target}`;                             /* 비인코딩! */
  else if (proxyNum === 1) url = `https://api.allorigins.win/raw?url=${encodeURIComponent(target)}`;
  else if (proxyNum === 2) url = `https://thingproxy.freeboard.io/fetch/${target}`;
  else                     url = `https://api.codetabs.com/v1/proxy?quest=${target}`;

  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 12000);
  try {
    const headers = { 'Accept': 'application/json', 'X-Requested-With': 'XMLHttpRequest' };
    const resp = await fetch(url, { signal: controller.signal, headers });
    clearTimeout(timer);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const raw  = await resp.json();
    /* allorigins /raw returns parsed JSON directly */
    const data = raw?.quoteResponse ? raw : (raw?.contents ? JSON.parse(raw.contents) : raw);
    const results = data?.quoteResponse?.result;
    if (!results?.length) throw new Error('empty result');
    return results;
  } catch(e) {
    clearTimeout(timer);
    throw e;
  }
}

/* ─── 전략 4: Alpha Vantage 순차 조회 (폴백) ─── */
async function fetchAlphaVantage() {
  const results = [];
  const lbl = document.getElementById('dateLabel');
  setApiMsg('⏳ Alpha Vantage 순차 조회 중 (전략 4)...');

  for (let i = 0; i < mainData.length; i++) {
    const sym = mainData[i].ticker;
    if (i > 0) {
      if (lbl) lbl.textContent = `⏳ ${ALPHA_DELAY/1000}s 대기 → ${sym}`;
      await sleep(ALPHA_DELAY);
    }
    if (lbl) lbl.textContent = `🔄 ${sym} 조회 중...`;
    try {
      const url = `https://www.alphavantage.co/query?function=GLOBAL_QUOTE&symbol=${sym}&apikey=${ALPHA_KEY}`;
      const ctrl = new AbortController();
      const t    = setTimeout(() => ctrl.abort(), 12000);
      const resp = await fetch(url, { signal: ctrl.signal });
      clearTimeout(t);
      if (!resp.ok) continue;
      const data = await resp.json();
      if (data['Note'] || data['Information']) {
        console.warn('[AV] Rate limit:', (data['Note']||data['Information']).slice(0,80));
        await sleep(62000);
        i--; continue;
      }
      const q = data['Global Quote'];
      if (!q || !q['05. price']) continue;
      results.push({
        symbol: sym,
        regularMarketPrice:         parseFloat(q['05. price']),
        regularMarketChangePercent: parseFloat((q['10. change percent']||'0%').replace('%','')),
        regularMarketChange:        parseFloat(q['09. change']||'0'),
        regularMarketPreviousClose: parseFloat(q['08. previous close']||'0'),
        regularMarketTime:          Math.floor(Date.now()/1000),
        preMarketPrice:             null,
        preMarketChangePercent:     null,
        postMarketPrice:            null,
        postMarketChangePercent:    null,
        marketState:                'REGULAR',
        regularMarketDayHigh:       parseFloat(q['03. high']||'0'),
        regularMarketDayLow:        parseFloat(q['04. low']||'0'),
      });
      console.log(`[AV] ✓ ${sym} $${q['05. price']}`);
    } catch(e) {
      console.warn(`[AV] ${sym}:`, e.message);
    }
  }
  return results.length ? results : null;
}

/* ─── 메인: 4전략 순서대로 시도 ─── */
async function fetchAllQuotes() {
  const syms = mainData.map(a => a.ticker).join(',');

  /* 전략 1~3: Yahoo Finance 프록시 (빠름) */
  for (let pi = 0; pi < 4; pi++) {
    try {
      const results = await tryYahooProxy(pi, syms);
      console.log(`[API] ✓ Yahoo 프록시 ${pi+1} 성공 (${results.length}종목)`);
      return results;
    } catch(e) {
      console.warn(`[API] 프록시 ${pi+1} 실패:`, e.message?.slice(0,80));
    }
  }

  /* 전략 4: Alpha Vantage 폴백 */
  console.log('[API] Yahoo 전략 모두 실패 → Alpha Vantage 폴백');
  return await fetchAlphaVantage();
}

/* ─── 업데이트 실행 ─── */
async function fetchQuickUpdate() {
  if (_syncing) { toast('⏳ 이미 동기화 중입니다'); return false; }
  _syncing = true;
  setSync('spin');
  setApiMsg('🔄 데이터 조회 중...');

  const session = getKstSession();
  console.log(`[KST] 세션: ${session}`);

  const results = await fetchAllQuotes();
  if (!results || !results.length) {
    _syncing = false;
    setSync('err');
    setApiMsg('✗ 모든 API 실패 — 인터넷 연결 및 F12 콘솔 확인');
    return false;
  }

  let hit = 0;
  results.forEach(q => {
    const idx = mainData.findIndex(a => a.ticker === q.symbol);
    if (idx < 0) return;
    const a = mainData[idx];

    a.currentPrice  = q.regularMarketPrice             || a.currentPrice;
    a.changePercent = q.regularMarketChangePercent      || 0;
    a.changeAbs     = q.regularMarketChange             || 0;
    a.prevClose     = q.regularMarketPreviousClose      || 0;
    a.todayHigh     = q.regularMarketDayHigh            || 0;
    a.todayLow      = q.regularMarketDayLow             || 0;
    a.latestDay     = q.regularMarketTime
      ? new Date(q.regularMarketTime*1000).toLocaleDateString('en-US',{month:'2-digit',day:'2-digit'})
      : '';
    a.preMarketPrice  = q.preMarketPrice              || null;
    a.preMarketChg    = q.preMarketChangePercent       || null;
    a.preMarketChgAbs = q.preMarketChange              || null;
    a.postMarketPrice = q.postMarketPrice              || null;
    a.postMarketChg   = q.postMarketChangePercent      || null;
    a.marketState     = session;

    const activePx = (session === 'PRE' && a.preMarketPrice) ? a.preMarketPrice : a.currentPrice;
    if (a.avgPrice > 0) a.performance = ((activePx / a.avgPrice) - 1) * 100;

    const preStr = a.preMarketPrice
      ? ` | 프리: $${a.preMarketPrice.toFixed(2)} (${a.preMarketChg>=0?'+':''}${a.preMarketChg?.toFixed(2)}%)`
      : '';
    console.log(`[✓] ${q.symbol} $${a.currentPrice.toFixed(2)}${preStr} | 세션: ${session}`);
    hit++;
  });

  _syncing = false;
  saveLS();
  initDash();
  updateMarketState(session);

  if (hit > 0) {
    setSync('live');
    const lbl = {REGULAR:'⚡ 실시간', PRE:'🌅 프리장', CLOSED:'🔒 종가'}[session] || '종가';
    setApiMsg(`${lbl} ${hit}종목 반영 · ${new Date().toLocaleTimeString('ko-KR')}`);
    setTimeout(() => setApiMsg(''), 8000);
    return true;
  } else {
    setSync('err');
    setApiMsg('✗ 데이터 파싱 실패');
    return false;
  }
}

/* ─── 마켓 상태 배지 ─── */
function updateMarketState(session) {
  const el  = document.getElementById('mktState');
  const lbl = document.getElementById('mktStateLabel');
  if (!el || !lbl) return;
  const MAP = { PRE:['pre','🌅 프리장'], REGULAR:['reg','⚡ 정규장'], CLOSED:['cls','🔒 종가'] };
  const [c, t] = MAP[session] || MAP.CLOSED;
  el.className = c;
  lbl.textContent = t;
}

/* ─── 자동 갱신 ─── */
function toggleAutoRefresh() {
  _autoOn = !_autoOn;
  const btn = document.getElementById('autoRefreshBtn');
  if (_autoOn) {
    btn.classList.add('refresh-on');
    btn.innerHTML = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> ON ${REFRESH_SEC}초`;
    scheduleAuto();
    toast(`⏱ ${REFRESH_SEC}초 자동갱신 시작`);
  } else {
    btn.classList.remove('refresh-on');
    btn.innerHTML = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> 자동갱신`;
    if (_autoTimer) { clearTimeout(_autoTimer); _autoTimer = null; }
    toast('⏹ 자동 갱신 해제');
  }
}
function scheduleAuto() {
  if (!_autoOn) return;
  _autoTimer = setTimeout(async () => { await fetchQuickUpdate(); scheduleAuto(); }, REFRESH_SEC * 1000);
}
/* ═══════════════════════════════════════════
   실시간 USD/KRW 환율 — exchangerate-api (무료)
   폴백: frankfurter.app → er-api.com
   ═══════════════════════════════════════════ */
async function fetchFXRate() {
  const ENDPOINTS = [
    async () => {
      const r = await fetch('https://open.er-api.com/v6/latest/USD', { signal: AbortSignal.timeout(8000) });
      const d = await r.json();
      return d?.rates?.KRW || null;
    },
    async () => {
      const r = await fetch('https://api.frankfurter.app/latest?from=USD&to=KRW', { signal: AbortSignal.timeout(8000) });
      const d = await r.json();
      return d?.rates?.KRW || null;
    },
    async () => {
      const r = await fetch('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json', { signal: AbortSignal.timeout(8000) });
      const d = await r.json();
      return d?.usd?.krw || null;
    },
  ];
  for (const fn of ENDPOINTS) {
    try {
      const rate = await fn();
      if (rate && rate > 900 && rate < 2000) {
        const prev = FX;
        FX = Math.round(rate * 100) / 100;
        const chg = ((FX / prev) - 1) * 100;
        const chgStr = (chg >= 0 ? '+' : '') + chg.toFixed(2) + '%';
        console.log(`[FX] USD/KRW = ${FX} (${chgStr})`);
        /* 화면 업데이트 */
        const fxEl  = document.getElementById('tb-fx');
        const fxEl2 = document.getElementById('v-fx');
        const fxChg = document.getElementById('v-fx-chg');
        if (fxEl)  fxEl.textContent  = (FX).toLocaleString('ko-KR', {minimumFractionDigits:0, maximumFractionDigits:0}) + '원';
        if (fxEl2) fxEl2.textContent = (FX).toLocaleString('ko-KR', {minimumFractionDigits:0, maximumFractionDigits:0});
        if (fxChg) { fxChg.textContent = `${chgStr} · 실시간`; fxChg.style.color = chg >= 0 ? 'var(--up)' : 'var(--dn)'; }
        return FX;
      }
    } catch(e) {
      console.warn('[FX]', e.message?.slice(0,60));
    }
  }
  console.warn('[FX] 모든 환율 API 실패 — 기존값 유지:', FX);
  return FX;
}


function setSync(state) {
  const el  = document.getElementById('sd');
  const lbl = document.getElementById('dateLabel');
  const now = new Date();
  const hhmm = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  el.className = '';
  if (state === 'live') {
    el.classList.add('live');
    if (lbl) lbl.textContent = `${now.getMonth()+1}/${now.getDate()} ⚡ LIVE ${hhmm}`;
  } else if (state === 'spin') {
    el.classList.add('spin');
    if (lbl) lbl.textContent = '실시간 조회 중...';
  } else if (state === 'err') {
    el.classList.add('err');
    if (lbl) lbl.textContent = `${now.getMonth()+1}/${now.getDate()} · 오류`;
  } else {
    if (lbl) lbl.textContent = `${now.getMonth()+1}/${now.getDate()} · 캐시`;
  }
}

async function runGemini(stats) {
  const el = document.getElementById('ai-text');
  if (!el) return;
  el.innerHTML = '<span style="color:var(--blue);font-size:12px">🤖 AI 분석 중...</span>';

  /* 포트폴리오 상세 컨텍스트 빌드 */
  let portfolioCtx = mainData.map(a => {
    const perf = a.performance >= 0 ? '+'+a.performance.toFixed(1)+'%' : a.performance.toFixed(1)+'%';
    const krw  = Math.round(a.qty * a.currentPrice * FX);
    const session = a.marketState || 'CLOSED';
    let priceInfo = `$${a.currentPrice.toFixed(2)}`;
    if (session === 'PRE' && a.preMarketPrice)
      priceInfo += ` (프리장 $${a.preMarketPrice.toFixed(2)}, ${a.preMarketChg>=0?'+':''}${a.preMarketChg?.toFixed(1)}%)`;
    return `${a.ticker}(${a.name}): ${a.qty}주 · ${priceInfo} · 수익률 ${perf} · 평가 ${Math.round(krw/10000)}만원`;
  }).join('\n');

  let otherCtx = otherData.map(a => {
    const perf = a.performance >= 0 ? '+'+a.performance.toFixed(1)+'%' : a.performance.toFixed(1)+'%';
    const krw  = a.isUSD===false ? a.currentPrice : a.qty*a.currentPrice*FX;
    return `${a.ticker}(${a.name}): ${a.label} · 수익률 ${perf} · 평가 ${Math.round(krw/10000)}만원`;
  }).join('\n');

  const session = getKstSession();
  const sessionLabel = {REGULAR:'정규장(실시간)',PRE:'프리장',CLOSED:'장마감'}[session]||'장마감';

  const prompt = `너는 41세 공공기관 노조위원장의 전담 퀀트 투자 비서다.

[현재 포트폴리오 현황]
총 평가자산: ${Math.round((stats.total||0)/10000)}만원
목표(3.4억) 달성률: ${stats.pct}% (잔여 ${Math.round((stats.rem||0)/10000)}만원)
현재 마켓 세션: ${sessionLabel}

[주식 포지션]
${portfolioCtx}

[크립토 포지션]
${otherCtx}

위 포트폴리오를 분석해서 아래 형식으로 3~5문장으로 단호하고 명확하게 보고해라.
단 markdown 기호(**##) 사용 금지, 불필요한 인사말 금지.
① 현재 가장 주목해야 할 종목과 이유 ② 리스크 요인 1가지 ③ 오늘의 핵심 액션`;

  try {
    const r = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`,
      { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          contents:[{parts:[{text: prompt}]}],
          generationConfig:{temperature:0.7, maxOutputTokens:400}
        })
      }
    );
    const res = await r.json();
    const txt = res.candidates?.[0]?.content?.parts?.[0]?.text;
    if (txt) {
      /* 줄바꿈 보존 + 이스케이프 처리 */
      const safe = txt.replace(/</g,'&lt;').replace(/>/g,'&gt;');
      const lines = safe.split('\n').filter(l=>l.trim());
      el.innerHTML = lines.map(l=>`<p style="margin-bottom:8px;color:var(--t1);font-size:11.5px;line-height:1.85">${l}</p>`).join('');
    } else {
      console.warn('[Gemini] 응답 없음:', JSON.stringify(res).slice(0,200));
      throw new Error('empty response');
    }
  } catch(e) {
    console.error('[Gemini]', e);
    el.innerHTML = `<span style="color:var(--dn);font-size:11px">⚠ AI API 오류 (${e.message?.slice(0,40)||'unknown'})</span>`;
  }
}

function swChart(t) {
  ['b','p'].forEach(x=>{
    document.getElementById('tab'+x.toUpperCase()).classList.toggle('on',x===t);
    document.getElementById('chart'+x.toUpperCase()).classList.toggle('hidden',x!==t);
    document.getElementById('chartD').style.display = x==='b'?'flex':'none';
  });
  setTimeout(()=>{ if(t==='b') window.myBar?.resize(); else window.myPerf?.resize(); },60);
}

/* TICKER */
function renderTicker() {
  const items = [...mainData, ...otherData];
  let h='';
  for(let pass=0;pass<2;pass++) {
    items.forEach(a=>{
      const st = a.marketState || 'CLOSED';
      const hasPre  = a.preMarketPrice  && (st==='PRE'||st==='PREPRE');
      const hasPost = a.postMarketPrice && st==='POST';
      let px, chg, badgeTxt='', badgeCol='';
      if (hasPre) {
        px = '$'+a.preMarketPrice.toFixed(2);
        chg = a.preMarketChg || 0;
        badgeTxt = '🌅';
      } else if (hasPost) {
        px = '$'+a.postMarketPrice.toFixed(2);
        chg = a.postMarketChg || 0;
        badgeTxt = '🌙';
      } else {
        px = a.isUSD===false ? fmt(a.currentPrice)+'₩' : '$'+Number(a.currentPrice).toFixed(2);
        chg = a.changePercent || 0;
      }
      const pu = chg >= 0;
      h+=`<div class="tick">
        <span class="t-sym">${a.ticker}</span>
        ${badgeTxt?`<span style="font-size:8px">${badgeTxt}</span>`:''}
        <span class="t-px">${px}</span>
        <span class="t-ch ${pu?'u':'d'}">${pu?'▲':'▼'}${Math.abs(chg).toFixed(2)}%</span>
      </div>
      <div class="t-sep"></div>`;
    });
  }
  document.getElementById('tickerInner').innerHTML=h;
}

function saveEdits(){
  let np=0;const nl=[],nm=[];
  document.querySelectorAll('#eMain>[data-mi]').forEach(row=>{
    const i=parseInt(row.dataset.mi),orig=mainData[i];if(!orig)return;
    const nq=parseFloat(row.querySelector('.input-qty').value)||orig.qty;
    const na=parseFloat(row.querySelector('.input-price').value)||orig.avgPrice||orig.currentPrice;
    if(nq<orig.qty){const s=orig.qty-nq,pr=(orig.currentPrice-na)*s*FX;np+=pr;nl.push({date:new Date().toISOString(),asset:orig.ticker,type:'SELL',qty:s,profitKrw:pr});}
    else if(nq>orig.qty) nl.push({date:new Date().toISOString(),asset:orig.ticker,type:'BUY',qty:nq-orig.qty,profitKrw:0});
    if(nq>0) nm.push({...orig,qty:nq,avgPrice:na,performance:na>0?((orig.currentPrice/na)-1)*100:0});
  });
  const no=[];
  document.querySelectorAll('#eOther>div').forEach(row=>{
    if(row.dataset.new==='true'){
      const t=(row.querySelector('.input-ticker')?.value||'').trim().toUpperCase();
      const q=parseFloat(row.querySelector('.input-qty')?.value)||0;
      const p=parseFloat(row.querySelector('.input-price')?.value)||0;
      if(t&&q>0){no.push({ticker:t,name:t,label:`${q}주`,qty:q,currentPrice:p,performance:0,isUSD:true,accent:'#22c97a',logo:''});nl.push({date:new Date().toISOString(),asset:t,type:'BUY',qty:q,profitKrw:0});}
    } else {
      const i=parseInt(row.dataset.oi),orig=otherData[i];if(!orig)return;
      const nq=parseFloat(row.querySelector('.input-qty').value)||orig.qty;
      const na=parseFloat(row.querySelector('.input-price').value)||(orig.currentPrice/(1+((orig.performance||0)/100)));
      if(nq<orig.qty){const s=orig.qty-nq,pr=orig.isUSD===false?(orig.currentPrice-na)*s:(orig.currentPrice-na)*s*FX;np+=pr;nl.push({date:new Date().toISOString(),asset:orig.ticker,type:'SELL',qty:s,profitKrw:pr});}
      else if(nq>orig.qty) nl.push({date:new Date().toISOString(),asset:orig.ticker,type:'BUY',qty:nq-orig.qty,profitKrw:0});
      if(nq>0) no.push({...orig,qty:nq,performance:na>0?((orig.currentPrice/na)-1)*100:0});
    }
  });
  mainData=nm;otherData=no;realizedProfit+=np;tradeHistory=[...nl,...tradeHistory];
  saveLS();cls('emModal');initDash();toast('✓ 저장 완료');
}

let _qa=null,_qaT=null;
function openQE(idx,type){
  const a=type==='main'?mainData[idx]:otherData[idx];if(!a)return;
  _qa={...a,_idx:idx};_qaT=type;
  document.getElementById('qaTitle').textContent=`${a.ticker} 포지션 수정`;
  document.getElementById('qaTitle').style.color=a.accent||'var(--blue)';
  document.getElementById('qaQty').value=a.qty;
  document.getElementById('qaAvg').value=a.avgPrice?(a.avgPrice.toFixed(a.isUSD===false?0:2)):'';
  document.getElementById('qaAvgLbl').textContent=`매입가 ${a.isUSD===false?'(₩)':'($)'}`;
  const p=Number(a.performance);
  const krw=a.isUSD===false?a.currentPrice:a.qty*a.currentPrice*FX;
  const prevStr = a.prevClose ? ` | 전일종가: $${a.prevClose}` : '';
  const dateStr = a.latestDay ? ` (${a.latestDay})` : '';
  document.getElementById('qaInfo').textContent=
    `현재가  ${a.isUSD===false?fmt(a.currentPrice)+'원':'$'+Number(a.currentPrice).toFixed(2)}${prevStr}${dateStr}\n`+
    `수익률  ${p>=0?'+':''}${p.toFixed(2)}%\n`+
    `평가액  ${fmtM(krw)}원   보유 ${a.qty}주`;
  open('qaModal');
}
function saveQE(){
  if(!_qa)return;
  const nq=parseFloat(document.getElementById('qaQty').value);
  const na=parseFloat(document.getElementById('qaAvg').value);
  if(isNaN(nq)||nq<=0){toast('⚠ 수량을 입력해주세요');return;}
  const orig=_qa,logs=[];
  if(nq<orig.qty){const s=orig.qty-nq,pr=orig.isUSD===false?(orig.currentPrice-na)*s:(orig.currentPrice-(na||orig.avgPrice||orig.currentPrice))*s*FX;realizedProfit+=pr;logs.push({date:new Date().toISOString(),asset:orig.ticker,type:'SELL',qty:s,profitKrw:pr});}
  else if(nq>orig.qty) logs.push({date:new Date().toISOString(),asset:orig.ticker,type:'BUY',qty:nq-orig.qty,profitKrw:0});
  const perf=(na&&na>0)?((orig.currentPrice/na)-1)*100:orig.performance;
  const upd={...orig,qty:nq,avgPrice:isNaN(na)?orig.avgPrice:na,performance:perf,_idx:undefined};
  if(_qaT==='main') mainData[orig._idx]=upd; else otherData[orig._idx]=upd;
  tradeHistory=[...logs,...tradeHistory];
  saveLS();cls('qaModal');_qa=null;initDash();toast(`✓ ${orig.ticker} 업데이트`);
}

/* ═══ MOBILE initDash ═══ */
function initMobile() {
  const s = calcStats();
  const fmtW = n => n>=1e8?(n/1e8).toFixed(1)+'억':(n/1e6).toFixed(0)+'M';

  /* Overview */
  const setT = (id,v) => { const e=document.getElementById(id); if(e) e.textContent=v; };
  setT('m-total', fmtM(s.total)+'원');
  setT('m-pct', s.pct+'%');
  setT('m-pct2', s.pct+'%');
  setT('m-tv', fmt(s.total)+'원');
  setT('m-rem', fmt(s.rem)+'원');
  setT('m-acnt', mainData.length+'종목');
  setT('m-cnt', (mainData.length+otherData.length)+'종');
  const bar = document.getElementById('m-bar');
  if(bar) bar.style.width = s.pct+'%';

  /* FX */
  setT('m-fx', FX.toLocaleString('ko-KR',{maximumFractionDigits:0}));
  setT('m-fxLbl', FX.toLocaleString('ko-KR',{maximumFractionDigits:0})+'원');

  /* Gain */
  let totAcq=0,totCurr=0;
  mainData.forEach(a=>{totAcq+=(a.avgPrice||a.currentPrice)*a.qty*FX; totCurr+=a.currentPrice*a.qty*FX;});
  otherData.forEach(a=>{
    const pf=(a.performance||0)/100;
    const curr=a.isUSD===false?a.currentPrice:a.currentPrice*a.qty*FX;
    const acq=curr/(1+pf); totCurr+=curr; totAcq+=acq;
  });
  const gain=totCurr-totAcq;
  const gPct=totAcq>0?((totCurr/totAcq-1)*100):0;
  const gainEl=document.getElementById('m-gain');
  if(gainEl){ gainEl.textContent=(gain>=0?'+':'')+fmtM(Math.abs(gain))+'원'; gainEl.style.color=gain>=0?'var(--oj)':'var(--dn)'; }
  const gainVel=document.getElementById('m-gainv');
  if(gainVel){ gainVel.textContent=(gain>=0?'+':'')+fmtMs(gain)+'M원'; gainVel.style.color=gain>=0?'var(--oj)':'var(--dn)'; }
  const gainPel=document.getElementById('m-gainp');
  if(gainPel){ gainPel.textContent='매입대비 '+(gPct>=0?'+':'')+gPct.toFixed(1)+'%'; gainPel.style.color=gPct>=0?'var(--up)':'var(--dn)'; }
  setT('m-acq', fmtM(totAcq)+'원');

  /* Render tables */
  renderMMain();
  renderMOther();
  renderMRank();
  renderMTrade();
  renderMTicker();
  if(_curPage===4) renderMCharts();
}

function renderMCharts() {
  if(mChartB){mChartB.destroy();mChartB=null;}
  if(mChartP){mChartP.destroy();mChartP=null;}
  const labels=[...mainData,...otherData].map(a=>a.ticker);
  const vals=[...mainData.map(a=>Math.round(a.qty*a.currentPrice*FX/1e6)),...otherData.map(a=>Math.round((a.isUSD===false?a.currentPrice:a.qty*a.currentPrice*FX)/1e6))];
  const perfs=[...mainData.map(a=>+a.performance),...otherData.map(a=>+a.performance)];
  const colors=[...mainData.map(a=>a.accent||'#5b8dee'),...otherData.map(a=>a.accent||'#f7931a')];
  const opts={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>ctx.raw+(ctx.chart.id===mChartB?.id?'M₩':'%')}}},scales:{x:{ticks:{color:'rgba(255,255,255,0.4)',font:{size:10,family:'JetBrains Mono'}},grid:{display:false}},y:{ticks:{color:'rgba(255,255,255,0.4)',font:{size:10,family:'JetBrains Mono'}},grid:{color:'rgba(255,255,255,0.05)'}}}};
  mChartB=new Chart(document.getElementById('m-cBar'),{type:'bar',data:{labels,datasets:[{data:vals,backgroundColor:colors.map(c=>c+'cc'),borderColor:colors,borderWidth:1,borderRadius:4}]},options:opts});
  const perfColors=perfs.map(p=>p>=0?'rgba(48,217,136,0.7)':'rgba(240,82,82,0.7)');
  mChartP=new Chart(document.getElementById('m-cPerf'),{type:'bar',data:{labels,datasets:[{data:perfs,backgroundColor:perfColors,borderRadius:4}]},options:{...opts,plugins:{...opts.plugins,tooltip:{callbacks:{label:ctx=>ctx.raw+'%'}}}}});

  /* Sectors */
  const sectors=[{name:'반도체',tickers:['MU','TSM','NVDA','SOXL'],color:'#8a5cf5'},{name:'에너지',tickers:['CEG'],color:'#4a7cfc'},{name:'핀테크·크립토',tickers:['CRCL','BTC','XRP'],color:'#22c97a'},{name:'양자컴퓨팅',tickers:['IONQ'],color:'#fb923c'}];
  const dVals=sectors.map(sec=>{let v=0;[...mainData,...otherData].filter(a=>sec.tickers.includes(a.ticker)).forEach(a=>{v+=a.isUSD===false?a.currentPrice:a.qty*a.currentPrice*FX;});return v;});
  const dSum=dVals.reduce((a,b)=>a+b,0);
  const sel=document.getElementById('m-sectors');
  if(sel) sel.innerHTML=sectors.map((sec,i)=>{
    const pct=dSum>0?((dVals[i]/dSum)*100).toFixed(1):'0.0';
    return `<div class="sb"><div class="sb-hd"><span class="sb-name">${sec.name}</span><span class="sb-pct" style="color:${sec.color}">${pct}%</span></div><div class="sb-bar"><div class="sb-fill" style="width:${pct}%;background:${sec.color}"></div></div></div>`;

}

/* ═══ GEMINI DIRECT TO ELEMENT ═══ */
async function runGeminiToEl(el, stats) {
  el.innerHTML='<span style="color:var(--blue);font-size:12px">🤖 AI 분석 중...</span>';
  const session = getKstSession();
  const sessionLabel = {REGULAR:'정규장(실시간)',PRE:'프리장',CLOSED:'장마감'}[session]||'장마감';
  let portfolioCtx = mainData.map(a => {
    const perf = a.performance >= 0 ? '+'+a.performance.toFixed(1)+'%' : a.performance.toFixed(1)+'%';
    const krw  = Math.round(a.qty * a.currentPrice * FX);
    const priceInfo = (session==='PRE' && a.preMarketPrice) ? '$'+a.currentPrice.toFixed(2)+' (프리장 $'+a.preMarketPrice.toFixed(2)+')' : '$'+a.currentPrice.toFixed(2);
    return `${a.ticker}(${a.name}): ${a.qty}주 · ${priceInfo} · 수익률 ${perf} · 평가 ${Math.round(krw/10000)}만원`;
  }).join('\n');
  let otherCtx = otherData.map(a => {
    const perf = a.performance >= 0 ? '+'+a.performance.toFixed(1)+'%' : a.performance.toFixed(1)+'%';
    const krw  = a.isUSD===false ? a.currentPrice : a.qty*a.currentPrice*FX;
    return `${a.ticker}(${a.name}): ${a.label} · 수익률 ${perf} · 평가 ${Math.round(krw/10000)}만원`;
  }).join('\n');
  const recentNews = `[전일 이슈] NVDA Q4실적 호조+Meta GPU계약 / TSM 1월매출+36.8% / MU HBM3E완판 / CEG 원전전력 핵심주 / CRCL 스테이블코인법안 / BTC 트럼프 전략자산 행정명령 / XRP SEC합의 기대`.trim();
  const prompt = `너는 41세 공공기관 노조위원장 전담 퀀트비서다. 목표 3.4억, 달성 ${stats.pct}%.
[포트폴리오] 총 ${Math.round((stats.total||0)/10000)}만원 | 세션: ${sessionLabel}
[주식] ${portfolioCtx}
[크립토] ${otherCtx}
${recentNews}
전일이슈+포트폴리오 종합, 5문장, 팩트중심. markdown금지. ① 주목종목(근거) ② 리스크 ③ 오늘액션`;
  try {
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:0.7,maxOutputTokens:400}})});
    const res = await r.json();
    const txt = res.candidates?.[0]?.content?.parts?.[0]?.text;
    if(txt){
      const safe=txt.replace(/</g,'&lt;').replace(/>/g,'&gt;');
      const lines=safe.split('\n').filter(l=>l.trim());
      el.innerHTML=lines.map(l=>`<p style="margin-bottom:8px;color:var(--t1);font-size:12px;line-height:1.85">${l}</p>`).join('');
    } else throw 0;
  } catch(e) {
    el.innerHTML='<span style="color:var(--dn);font-size:11px">⚠ AI API 오류. 기존 전략 유지.</span>';
  }
}

/* ═══ 실시간 크립토 (BTC/XRP) ═══ */
async function fetchCryptoPrices() {
  const ENDPOINTS = [
    async () => {
      const r = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ripple&vs_currencies=krw&include_24hr_change=true', { signal: AbortSignal.timeout(9000) });
      const d = await r.json();
      if (!d?.bitcoin?.krw) throw new Error('empty');
      return { BTC:{price:d.bitcoin.krw, chg24h:d.bitcoin.krw_24h_change||0}, XRP:{price:d.ripple.krw, chg24h:d.ripple.krw_24h_change||0} };
    },
    async () => {
      const r = await fetch('https://api.upbit.com/v1/ticker?markets=KRW-BTC,KRW-XRP', { signal: AbortSignal.timeout(9000) });
      const d = await r.json();
      if (!Array.isArray(d)) throw new Error('empty');
      const m={};d.forEach(t=>{m[t.market]=t;});
      return { BTC:{price:m['KRW-BTC']?.trade_price, chg24h:(m['KRW-BTC']?.signed_change_rate||0)*100}, XRP:{price:m['KRW-XRP']?.trade_price, chg24h:(m['KRW-XRP']?.signed_change_rate||0)*100} };
    },
    async () => {
      const [bR,xR] = await Promise.all([fetch('https://api.binance.com/api/v3/ticker/24hr?symbol=BTCUSDT',{signal:AbortSignal.timeout(9000)}),fetch('https://api.binance.com/api/v3/ticker/24hr?symbol=XRPUSDT',{signal:AbortSignal.timeout(9000)})]);
      const b=await bR.json(),x=await xR.json();
      return { BTC:{price:parseFloat(b.lastPrice)*FX, chg24h:parseFloat(b.priceChangePercent)}, XRP:{price:parseFloat(x.lastPrice)*FX, chg24h:parseFloat(x.priceChangePercent)} };
    },
  ];
  for (let i=0;i<ENDPOINTS.length;i++) {
    try {
      const data=await ENDPOINTS[i]();
      let updated=0;
      otherData.forEach(a=>{
        const info=data[a.ticker];
        if (!info?.price) return;
        const pricePerCoin = info.price;
        a.currentPrice  = Math.round(pricePerCoin * a.qty); /* 총 KRW */
        a.pricePerCoin  = Math.round(pricePerCoin);          /* 단가 저장 */
        a.changePercent = info.chg24h||0;
        if (a.avgPrice) {
          a.performance=((a.currentPrice/a.avgPrice)-1)*100;
        } else {
          const prevTotal=a._prevTotal||a.currentPrice;
          const oldPerf=a._origPerf??a.performance;
          a._origPerf=oldPerf; a._prevTotal=a.currentPrice;
          a.performance=((a.currentPrice/(prevTotal/(1+oldPerf/100)))-1)*100;
        }
        updated++;
      });
      if(updated>0){ saveLS(); initMobile(); return true; }
    } catch(e) { console.warn('[Crypto]',e.message?.slice(0,50)); }
  }
  return false;
}
